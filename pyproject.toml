[project]
name = "kconfigs"
version = "0.1.0"
description = "Fetch and summarize Linux kernel configuration files."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
dependencies = [
    "aiofiles",
    # 3.14.0 through 3.14.3 are affected by https://github.com/aio-libs/aiohttp/issues/13348.
    "aiohttp!=3.14.0,!=3.14.1,!=3.14.2,!=3.14.3",
    "aiosqlite",
    "multidict",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "ptpython",
    "pytest>=9.0.3",
    "ruff",
    "types-aiofiles",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
