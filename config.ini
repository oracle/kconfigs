## Templates

[ol_ueknext:]
name = Oracle Linux $version (UEK-NEXT) $arch
package = kernel-ueknext-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://yum.oracle.com/repo/OracleLinux/OL$version/developer/UEKnext/$arch/
key = RPM-GPG-KEY-oracle-development

[ol_uek:]
name = Oracle Linux $version (UEK $uekver) $arch
package = kernel-uek-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://yum.oracle.com/repo/OracleLinux/OL$version/UEKR$uekver/$arch/
key = RPM-GPG-KEY-oracle-ol$version

[ol_rhck:]
name = Oracle Linux $version (Red Hat Compatible) $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://yum.oracle.com/repo/OracleLinux/OL$version/baseos/latest/$arch/
key = RPM-GPG-KEY-oracle-ol$version

[fedora_rawhide:]
name = Fedora Rawhide $arch
version = Rawhide
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/$arch/os/
key = RPM-GPG-KEY-fedora-45-primary

[fedora:]
name = Fedora $version $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://dl.fedoraproject.org/pub/fedora/linux/releases/$version/Everything/$arch/os/
key = RPM-GPG-KEY-fedora-$version-primary

[fedora_asahi:]
name = Fedora Asahi Remix $version $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://download.copr.fedorainfracloud.org/results/@asahi/kernel/fedora-$version-$arch/
key = asahi.gpg

[centos:]
name = CentOS $version Stream $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://mirror.stream.centos.org/$version-stream/BaseOS/$arch/os/
key = RPM-GPG-KEY-CentOS-Official

[centos_hyperscale:]
name = CentOS Hyperscale $version $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://mirror.stream.centos.org/SIGs/$version-stream/hyperscale/$arch/packages-kernel/
key = RPM-GPG-KEY-CentOS-SIG-HyperScale

[ubuntu:]
package = linux-generic
fetcher = kconfigs.deb.DebIndex
extractor = kconfigs.deb.DebExtractor
key = ubuntu

[debian:]
fetcher = kconfigs.deb.DebIndex
extractor = kconfigs.deb.DebExtractor
index = http://ftp.us.debian.org/debian/
key = debian

[upstream:]
name = Upstream Default $version $arch
package = linux
fetcher = kconfigs.upstream.UpstreamIndex
extractor = kconfigs.upstream.DefconfigExtractor
index = https://www.kernel.org/feeds/kdist.xml
key = gregkh

[upstream_github:]
name = Upstream Default $version $arch
package = linux
fetcher = kconfigs.github.GithubIndex
extractor = kconfigs.upstream.DefconfigExtractor
index = https://github.com/openela/kernel-lts
key = NOVERIFY-GITHUB

[arch_linux:]
name = Arch $arch
package = linux
fetcher = kconfigs.pacman.PacmanIndex
extractor = kconfigs.pacman.PacmanExtractor
index = https://mirrors.edge.kernel.org/archlinux/core/os/$arch/
repo = core
key = archlinux

[android:]
name = Android $version $arch
arch = aarch64
package = linux
fetcher = kconfigs.android.AndroidGkiIndex
extractor = kconfigs.android.AndroidGkiExtractor

[alma:]
name = Alma Linux $version $arch
package = kernel-core
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://repo.almalinux.org/almalinux/$version/BaseOS/$arch/os/
key = RPM-GPG-KEY-AlmaLinux-$version

[opensuse_tw:]
name = openSUSE Tumbleweed $arch
package = kernel-default
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
key = RPM-GPG-KEY-opensuse-tw

[opensuse_leap:]
name = openSUSE Leap (SLES Compatible) $version $arch
package = kernel-default
fetcher = kconfigs.rpm.RpmIndex
extractor = kconfigs.rpm.RpmExtractor
index = https://download.opensuse.org/distribution/leap/$version/repo/oss/$arch/
key = RPM-GPG-KEY-opensuse-16

