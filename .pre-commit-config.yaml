# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: "^.*.json|.*/config"
    -   id: end-of-file-fixer
        exclude: "^.*.json|.*/config"
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: "^.*.json|.*/config"
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        files: "^.*.py$"
    -   id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        files: "^.*.py$"
    -   id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        args: [--strict, --disallow-untyped-calls]
        files: "^.*.py$"
        verbose: true
-   repo: https://github.com/netromdk/vermin
    rev: v1.8.0
    hooks:
    -   id: vermin
        args: ['-t=3.11-', '--violations', '--eval-annotations']
